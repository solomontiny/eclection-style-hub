name = "supplieraffordable"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
# Retain the Worker dashboard bindings on deploy. Configure these there:
# SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, PAYSTACK_SECRET_KEY
# VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_PAYSTACK_PUBLIC_KEY
keep_vars = true

routes = [
  { pattern = "www.supplieraffordable.com", zone_name = "supplieraffordable.com", custom_domain = true }
]

main = "./.output/server/index.mjs"

[vars]
SUPABASE_URL = "https://qwwpaxljefedekeysuye.supabase.co"

[assets]
directory = "./.output/public"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 1
